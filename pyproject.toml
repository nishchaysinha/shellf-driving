[project]
name = "shellf-driving"
version = "0.1.0"
description = "Drive terminal UIs the way Playwright drives browsers — for LLM agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyte>=0.8.1",
    "mcp[cli]>=1.2.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shellf = "shellf.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shellf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # stdlib pty.fork in a threaded process — inherent to the architecture, fine here
    "ignore:This process:DeprecationWarning",
]
